<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Blink Pay</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:20px auto;
    padding:15px;
}

.card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

pre{
    white-space:pre-wrap;
    word-break:break-all;
}

#invoiceBox{
    background:#f5f5f5;
    padding:10px;
    border-radius:8px;
}

#logs{
    background:#111;
    color:#00ff00;
    padding:10px;
    border-radius:8px;
    max-height:400px;
    overflow:auto;
    font-size:12px;
}

.success{
    color:green;
}

.error{
    color:red;
}

.wait{
    color:orange;
}

</style>
</head>
<body>

<div class="card">

<h2>⚡ Blink Pay</h2>

<input
    type="number"
    id="amount"
    placeholder="Montant"
>

<select id="currency">
    <option value="btc">
        BTC Lightning
    </option>
    <option value="usd">
        USD Stablesats
    </option>
</select>

<button onclick="createInvoice()">
    Générer Invoice
</button>

<div id="qrcode"></div>

<pre id="invoiceBox"></pre>

<div id="status">
    Statut : idle
</div>

</div>

<div class="card">

<h3>📋 Logs</h3>

<pre id="logs"></pre>

</div>

<script>

const API_URL =
"https://starkyblinkpay.billionsjonnhy.workers.dev";

let paymentHash = null;
let interval = null;

// ====================
// LOG SYSTEM
// ====================

function log(data){

    const logs =
        document.getElementById("logs");

    const now =
        new Date().toLocaleTimeString();

    logs.textContent =
        "[" + now + "]\n" +
        (
            typeof data === "string"
            ? data
            : JSON.stringify(
                data,
                null,
                2
            )
        ) +
        "\n\n" +
        logs.textContent;
}

// ====================
// CREATE INVOICE
// ====================

async function createInvoice(){

    clearInterval(interval);

    paymentHash = null;

    document.getElementById("qrcode")
        .innerHTML = "";

    document.getElementById("invoiceBox")
        .textContent = "";

    document.getElementById("status")
        .innerHTML =
        "⏳ Génération...";

    const amount =
        Number(
            document.getElementById("amount")
            .value
        );

    const currency =
        document.getElementById("currency")
        .value;

    if(!amount || amount <= 0){

        document.getElementById("status")
            .innerHTML =
            "<span class='error'>Montant invalide</span>";

        return;
    }

    try{

        log("Création invoice...");

        const response =
            await fetch(
                API_URL + "/invoice",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        amount,
                        currency
                    })
                }
            );

        const data =
            await response.json();

        log(data);

        const invoice =
            data?.data
            ?.lnInvoiceCreate
            ?.invoice;

        if(!invoice){

            document.getElementById("status")
                .innerHTML =
                "<span class='error'>Erreur création invoice</span>";

            return;
        }

        paymentHash =
            invoice.paymentHash;

        document.getElementById("invoiceBox")
            .textContent =
            invoice.paymentRequest;

        new QRCode(
            document.getElementById("qrcode"),
            invoice.paymentRequest
        );

        document.getElementById("status")
            .innerHTML =
            "<span class='wait'>⏳ En attente paiement...</span>";

        log(
            "PaymentHash : " +
            paymentHash
        );

        startPolling();

    }catch(error){

        log({
            error:error.message
        });

        document.getElementById("status")
            .innerHTML =
            "<span class='error'>Erreur</span>";
    }
}

// ====================
// START POLLING
// ====================

function startPolling(){

    clearInterval(interval);

    interval =
        setInterval(
            checkPayment,
            5000
        );

    log(
        "Polling démarré (5s)"
    );
}

// ====================
// CHECK PAYMENT
// ====================

async function checkPayment(){

    if(!paymentHash){
        return;
    }

    try{

        log(
            "Vérification statut..."
        );

        const response =
            await fetch(
                API_URL + "/status",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        paymentHash
                    })
                }
            );

        const data =
            await response.json();

        log(data);

        const status =
            data?.data
            ?.lnInvoicePaymentStatusByHash
            ?.status;

        if(!status){

            log(
                "Aucun statut retourné"
            );

            return;
        }

        log(
            "STATUS = " + status
        );

        if(
            status === "PAID" ||
            status === "SUCCESS" ||
            status === "SETTLED"
        ){

            clearInterval(interval);

            document.getElementById("status")
                .innerHTML =
                "<span class='success'>✅ Paiement confirmé</span>";

            log(
                "PAIEMENT CONFIRMÉ"
            );
        }

        if(
            status === "EXPIRED"
        ){

            clearInterval(interval);

            document.getElementById("status")
                .innerHTML =
                "<span class='error'>❌ Invoice expirée</span>";

            log(
                "INVOICE EXPIRÉE"
            );
        }

    }catch(error){

        log({
            error:error.message
        });
    }
}

</script>

</body>
</html>
