<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink Invoice Generator</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:500px;
    margin:30px auto;
    padding:20px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin:10px 0;
}

textarea{
    width:100%;
    height:180px;
}

#invoice{
    word-break:break-all;
}
</style>
</head>
<body>

<h2>Générateur Invoice Blink</h2>

<input
    type="number"
    id="amount"
    placeholder="Montant"
/>

<select id="currency">
    <option value="btc">
        Bitcoin Lightning
    </option>

    <option value="usd">
        USD Stablesats
    </option>
</select>

<button onclick="createInvoice()">
    Générer
</button>

<h3>Invoice</h3>
<textarea id="invoice" readonly></textarea>

<script>

const API_KEY = "blink_9J0zWrI30jdLUhwlW4ZXNWb8SKC98SSu2HwM3jAl2wYvVXaB3Ag0oA2HpL7lK6VG";

const BTC_WALLET =
"09b58fdc-7d5b-411e-a629-f55572dfb696";

const USD_WALLET =
"8a9c646f-4595-4af8-bdd5-a7d87121b1d6";

async function createInvoice(){

    const amount =
    Number(document.getElementById("amount").value);

    const currency =
    document.getElementById("currency").value;

    const walletId =
    currency === "btc"
    ? BTC_WALLET
    : USD_WALLET;

    const query = `
    mutation LnInvoiceCreate($input: LnInvoiceCreateInput!) {
      lnInvoiceCreate(input: $input) {
        invoice {
          paymentRequest
          paymentHash
          satoshis
        }
        errors {
          message
        }
      }
    }
    `;

    const variables = {
      input: {
        walletId,
        amount
      }
    };

    try{

        const response = await fetch(
            "https://api.blink.sv/graphql",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "X-API-KEY":API_KEY
                },
                body:JSON.stringify({
                    query,
                    variables
                })
            }
        );

        const data = await response.json();

        if(
            data.data &&
            data.data.lnInvoiceCreate &&
            data.data.lnInvoiceCreate.invoice
        ){

            document.getElementById("invoice").value =
            data.data.lnInvoiceCreate.invoice.paymentRequest;

        }else{

            document.getElementById("invoice").value =
            JSON.stringify(data,null,2);

        }

    }catch(err){

        document.getElementById("invoice").value =
        err.message;

    }
}
</script>

</body>
</html>
