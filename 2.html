<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink Invoice Checker</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:20px auto;
    padding:15px;
}
.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}
input,select,button{
    width:100%;
    padding:10px;
    margin:8px 0;
}
pre{
    white-space:pre-wrap;
    word-break:break-all;
}
</style>
</head>
<body>

<div class="card">

<h2>Blink Invoice Test</h2>

<input id="amount" type="number" placeholder="Montant">

<select id="currency">
    <option value="btc">BTC</option>
    <option value="usd">USD</option>
</select>

<button onclick="createInvoice()">
Générer invoice
</button>

<p id="status">Statut : idle</p>

<div id="qrcode"></div>

<pre id="invoice"></pre>

</div>

<script>

const API_KEY = "blink_9J0zWrI30jdLUhwlW4ZXNWb8SKC98SSu2HwM3jAl2wYvVXaB3Ag0oA2HpL7lK6VG";
const BTC_WALLET = "09b58fdc-7d5b-411e-a629-f55572dfb696";
const USD_WALLET = "8a9c646f-4595-4af8-bdd5-a7d87121b1d6";

let currentPaymentHash = null;
let currentPaymentRequest = null;
let pollInterval = null;

async function gql(query, variables = {}) {

    const response = await fetch(
        "https://api.blink.sv/graphql",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY
            },
            body: JSON.stringify({
                query,
                variables
            })
        }
    );

    return response.json();
}

async function createInvoice() {

    const amount =
        Number(document.getElementById("amount").value);

    const currency =
        document.getElementById("currency").value;

    const walletId =
        currency === "btc"
            ? BTC_WALLET
            : USD_WALLET;

    const query = `
    mutation($input: LnInvoiceCreateInput!) {
      lnInvoiceCreate(input: $input) {
        invoice {
          paymentRequest
          paymentHash
        }
        errors {
          message
        }
      }
    }`;

    const data = await gql(
        query,
        {
            input: {
                walletId,
                amount
            }
        }
    );

    console.log(data);

    const invoice =
        data?.data?.lnInvoiceCreate?.invoice;

    if (!invoice) {

        document.getElementById("invoice").textContent =
            JSON.stringify(data, null, 2);

        return;
    }

    currentPaymentHash =
        invoice.paymentHash;

    currentPaymentRequest =
        invoice.paymentRequest;

    document.getElementById("invoice").textContent =
        invoice.paymentRequest;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        invoice.paymentRequest
    );

    document.getElementById("status").textContent =
        "Statut : attente paiement";

    startPolling();
}

function startPolling() {

    clearInterval(pollInterval);

    pollInterval =
        setInterval(checkPayment, 3000);
}

async function checkPayment() {

    if (!currentPaymentHash) return;

    const query = `
    query($input: LnInvoicePaymentStatusByHashInput!) {
      lnInvoicePaymentStatusByHash(input: $input) {
        status
        paymentHash
      }
    }`;

    const data = await gql(
        query,
        {
            input: {
                paymentHash:
                    currentPaymentHash
            }
        }
    );

    console.log(data);

    const status =
        data?.data?.lnInvoicePaymentStatusByHash?.status;

    if (!status) return;

    document.getElementById("status").textContent =
        "Statut : " + status;

    if (
        status === "PAID" ||
        status === "SETTLED" ||
        status === "SUCCESS"
    ) {

        clearInterval(pollInterval);

        document.getElementById("status").textContent =
            "✅ Paiement confirmé";
    }

    if (status === "EXPIRED") {

        clearInterval(pollInterval);

        document.getElementById("status").textContent =
            "❌ Invoice expirée";
    }
}

</script>

</body>
</html>
