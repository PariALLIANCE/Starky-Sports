<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink Mini Wallet Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial;
    max-width: 520px;
    margin: 30px auto;
    padding: 15px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin:8px 0;
}

.box{
    padding:12px;
    border:1px solid #ddd;
    margin-top:15px;
    border-radius:8px;
}

#status{
    font-weight:bold;
}
</style>
</head>

<body>

<h2>⚡ Blink Mini Wallet (Test)</h2>

<!-- CREATE INVOICE -->
<div class="box">
<h3>Créer une invoice</h3>

<input type="number" id="amount" placeholder="Montant">

<select id="currency">
    <option value="btc">Bitcoin Lightning</option>
    <option value="usd">USD Stablesats</option>
</select>

<button onclick="createInvoice()">
Générer invoice
</button>

<pre id="invoice"></pre>

<div id="qrcode"></div>

<p id="status">Statut : en attente</p>
</div>

<!-- WITHDRAW -->
<div class="box">
<h3>Retrait (payer une invoice)</h3>

<input id="withdrawInvoice" placeholder="Invoice Lightning (lnbc...)">

<button onclick="payInvoice()">
Envoyer paiement
</button>

<pre id="withdrawResult"></pre>
</div>

<script>

const API_KEY = "blink_9J0zWrI30jdLUhwlW4ZXNWb8SKC98SSu2HwM3jAl2wYvVXaB3Ag0oA2HpL7lK6VG";

// Wallet IDs
const BTC_WALLET = "09b58fdc-7d5b-411e-a629-f55572dfb696";
const USD_WALLET = "8a9c646f-4595-4af8-bdd5-a7d87121b1d6";

let currentPaymentHash = null;
let pollInterval = null;

// ---------------------------
// CREATE INVOICE
// ---------------------------
async function createInvoice(){

    document.getElementById("status").innerText =
    "Statut : génération...";

    const amount =
    Number(document.getElementById("amount").value);

    const currency =
    document.getElementById("currency").value;

    const walletId =
    currency === "btc" ? BTC_WALLET : USD_WALLET;

    const query = `
    mutation LnInvoiceCreate($input: LnInvoiceCreateInput!) {
      lnInvoiceCreate(input: $input) {
        invoice {
          paymentRequest
          paymentHash
        }
        errors { message }
      }
    }`;

    const variables = {
        input: { walletId, amount }
    };

    const res = await fetch("https://api.blink.sv/graphql", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-API-KEY": API_KEY
        },
        body: JSON.stringify({ query, variables })
    });

    const data = await res.json();

    const invoice =
    data?.data?.lnInvoiceCreate?.invoice;

    if(!invoice){
        document.getElementById("invoice").innerText =
        JSON.stringify(data,null,2);
        return;
    }

    document.getElementById("invoice").innerText =
    invoice.paymentRequest;

    currentPaymentHash = invoice.paymentHash;

    // QR CODE
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), invoice.paymentRequest);

    // start polling payment
    startPolling();
}

// ---------------------------
// POLLING PAYMENT STATUS
// ---------------------------
function startPolling(){

    if(pollInterval){
        clearInterval(pollInterval);
    }

    document.getElementById("status").innerText =
    "Statut : en attente de paiement...";

    pollInterval = setInterval(checkPayment, 4000);
}

async function checkPayment(){

    const query = `
    query {
      me {
        defaultAccount {
          transactions(first:20) {
            edges {
              node {
                initiationVia {
                  ... on InitiationViaLn {
                    paymentHash
                  }
                }
              }
            }
          }
        }
      }
    }`;

    const res = await fetch("https://api.blink.sv/graphql", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-API-KEY": API_KEY
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const txs =
    data?.data?.defaultAccount?.transactions?.edges || [];

    for(let tx of txs){

        const hash =
        tx?.node?.initiationVia?.paymentHash;

        if(hash && hash === currentPaymentHash){

            clearInterval(pollInterval);

            document.getElementById("status").innerText =
            "✅ Paiement confirmé !";

            return;
        }
    }
}

// ---------------------------
// WITHDRAW PAYMENT
// ---------------------------
async function payInvoice(){

    const invoice =
    document.getElementById("withdrawInvoice").value;

    document.getElementById("withdrawResult").innerText =
    "Traitement...";

    const query = `
    mutation LnInvoicePaymentSend($input: LnInvoicePaymentSendInput!) {
      lnInvoicePaymentSend(input: $input) {
        status
        errors { message }
      }
    }`;

    const variables = {
        input: {
            paymentRequest: invoice
        }
    };

    const res = await fetch("https://api.blink.sv/graphql", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-API-KEY": API_KEY
        },
        body: JSON.stringify({ query, variables })
    });

    const data = await res.json();

    document.getElementById("withdrawResult").innerText =
    JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
