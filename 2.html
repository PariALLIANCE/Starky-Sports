<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink Wallet Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial;
    max-width:520px;
    margin:20px auto;
    padding:15px;
}

.card{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

input,select,button{
    width:100%;
    padding:10px;
    margin:6px 0;
}

#status{
    font-weight:bold;
}

.tx{
    font-size:12px;
    background:#f5f5f5;
    padding:6px;
    margin-top:5px;
    border-radius:5px;
    word-break:break-all;
}
</style>
</head>

<body>

<h2>⚡ Blink Wallet Pro (Test)</h2>

<!-- DEPOT -->
<div class="card">
<h3>📥 Recevoir</h3>

<input type="number" id="amount" placeholder="Montant">

<select id="currency">
<option value="btc">BTC Lightning</option>
<option value="usd">USD Stablesats</option>
</select>

<button onclick="createInvoice()">Générer invoice</button>

<pre id="invoice"></pre>
<div id="qrcode"></div>

<p id="status">Statut : idle</p>
</div>

<!-- RETRAIT -->
<div class="card">
<h3>📤 Retirer</h3>

<input id="withdrawInvoice" placeholder="Invoice Lightning (lnbc...)">

<button onclick="withdraw()">Envoyer</button>

<pre id="withdrawResult"></pre>
</div>

<!-- HISTORIQUE -->
<div class="card">
<h3>📜 Historique local</h3>
<div id="history"></div>
</div>

<script>

const API_KEY = "blink_9J0zWrI30jdLUhwlW4ZXNWb8SKC98SSu2HwM3jAl2wYvVXaB3Ag0oA2HpL7lK6VG";

const BTC_WALLET = "09b58fdc-7d5b-411e-a629-f55572dfb696";
const USD_WALLET = "8a9c646f-4595-4af8-bdd5-a7d87121b1d6";

let currentHash = null;
let interval = null;

let history = JSON.parse(localStorage.getItem("history") || "[]");

renderHistory();

// --------------------
// CREATE INVOICE
// --------------------
async function createInvoice(){

    const amount = Number(document.getElementById("amount").value);
    const currency = document.getElementById("currency").value;

    const walletId = currency === "btc" ? BTC_WALLET : USD_WALLET;

    const query = `
    mutation LnInvoiceCreate($input: LnInvoiceCreateInput!) {
      lnInvoiceCreate(input: $input) {
        invoice {
          paymentRequest
          paymentHash
        }
      }
    }`;

    const res = await fetch("https://api.blink.sv/graphql", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "X-API-KEY":API_KEY
        },
        body: JSON.stringify({
            query,
            variables:{
                input:{ walletId, amount }
            }
        })
    });

    const data = await res.json();

    const inv = data?.data?.lnInvoiceCreate?.invoice;

    if(!inv){
        document.getElementById("invoice").innerText =
        JSON.stringify(data,null,2);
        return;
    }

    document.getElementById("invoice").innerText = inv.paymentRequest;

    currentHash = inv.paymentHash;

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), inv.paymentRequest);

    startCheck();

    addHistory("INVOICE", amount + " " + currency, inv.paymentRequest);
}

// --------------------
// CHECK PAYMENT
// --------------------
function startCheck(){
    clearInterval(interval);

    document.getElementById("status").innerText =
    "⏳ attente paiement...";

    interval = setInterval(checkPayment, 4000);
}

async function checkPayment(){

    const query = `
    query {
      me {
        defaultAccount {
          transactions(first:20) {
            edges {
              node {
                initiationVia {
                  ... on InitiationViaLn {
                    paymentHash
                  }
                }
              }
            }
          }
        }
      }
    }`;

    const res = await fetch("https://api.blink.sv/graphql", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "X-API-KEY":API_KEY
        },
        body: JSON.stringify({ query })
    });

    const data = await res.json();

    const txs = data?.data?.defaultAccount?.transactions?.edges || [];

    for(let t of txs){
        const h = t?.node?.initiationVia?.paymentHash;

        if(h && h === currentHash){
            clearInterval(interval);

            document.getElementById("status").innerText =
            "✅ payé";

            addHistory("PAID", currentHash, "");

            return;
        }
    }
}

// --------------------
// WITHDRAW
// --------------------
async function withdraw(){

    const invoice =
    document.getElementById("withdrawInvoice").value.trim();

    document.getElementById("withdrawResult").innerText =
    "⏳ envoi...";

    const query = `
    mutation LnInvoicePaymentSend($input: LnInvoicePaymentInput!) {
      lnInvoicePaymentSend(input: $input) {
        status
        errors { message }
      }
    }`;

    const res = await fetch("https://api.blink.sv/graphql", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "X-API-KEY":API_KEY
        },
        body: JSON.stringify({
            query,
            variables:{
                input:{ paymentRequest: invoice }
            }
        })
    });

    const data = await res.json();

    document.getElementById("withdrawResult").innerText =
    JSON.stringify(data,null,2);

    addHistory("WITHDRAW", invoice, "");
}

// --------------------
// HISTORY
// --------------------
function addHistory(type, amount, data){

    history.unshift({
        type,
        amount,
        data,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    renderHistory();
}

function renderHistory(){

    document.getElementById("history").innerHTML =
    history.map(h =>
        `<div class="tx">
            ${h.type} - ${h.amount}<br>
            ${h.time}
        </div>`
    ).join("");
}

</script>

</body>
</html>
